    title_en: "Blindness to the Infrastructure of Control"
    skills: [contextual_reading]
    aliases:
      algorithms: 21
      universal: 22
    fields:
      context: |-
        В любой крупной организации конфликты не исчерпываются явными участниками. Существует незримая третья сторона — институциональная система контроля (служба безопасности, HR, внутренний надзор), чьи интересы и методы предсказуемы и должны быть просчитаны.
      idea: |-
        При анализе корпоративных ситуаций автоматически добавляйте два слоя: «Сбор информации для контроля» и «Документирование для кадровых служб». Проверяйте, не является ли каждая акция (несправедливая оценка, внезапный бонус, исключение из проекта) инструментом этих игроков.
      threshold: |-
        1. Компания крупная (>500 сотрудников) с выделенными службами.
        2. Ситуация касается формальных процедур (оценка, увольнение, реорганизация).
        3. Сотрудник имеет высокую экспертизу, публичную репутацию, неформальное лидерство.
        4. Присутствуют маркеры «информационной игры»: внезапные оценки, исключения, странные вопросы.
        5. Конфликт имеет системную природу (власть, статус, ресурсы), а не межличностную.
      key_technique: |-
        «Представьте, что за каждым участником стоит ещё один — тот, кто записывает, анализирует и готовит формальный отчёт. Как изменится сценарий?»

